# Compila el conector y su instalador en Windows y los publica como versión de
# GitHub. Se dispara al subir una etiqueta `v*` (p. ej. `git tag v1.3.0 && git
# push origin v1.3.0`). La caja descarga siempre la última desde
# releases/latest/download/setup-conector-impresion.exe.
name: Publicar conector

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Go 1.20 a propósito: es la última que compila para Windows 7 y 8, y las
      # PC de las sucursales son viejas (ver go.mod).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"

      - run: go test ./...

      # 32 bits (386): corre igual en Windows de 32 y de 64 bits.
      # -H windowsgui: sin consola negra frente al cajero.
      - name: Compilar el conector
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/glamouroso-print-agent.exe .

      # Inno Setup no siempre viene en la imagen del runner.
      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compilar el instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\setup.iss
          Move-Item installer\Output\setup-glamouroso-print-agent.exe setup-conector-impresion.exe

      - name: Publicar la versión
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" setup-conector-impresion.exe `
            --title "Conector de impresión ${{ github.ref_name }}" `
            --generate-notes
